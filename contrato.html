<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Prueba de contrato · mfe-carrito</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; background: #fafafa; }
    li { list-style: none; margin: 4px 0; } .ok { color: #1b7a3e; } .falla { color: #c0392b; font-weight: bold; }
    #zona { border: 1px dashed #bbb; padding: 12px; margin-top: 16px; }
  </style>
</head>
<body>
  <h1>Prueba de contrato · mfe-carrito</h1>
  <p>Verifica, sin el contenedor, lo que el micro frontend promete en CONTRATOS.md.</p>
  <ul id="resultados"></ul>
  <p id="resumen"></p>
  <div id="zona"></div>

  <script src="carrito.js"></script>
  <script>
    const resultados = [];
    function verificar(descripcion, condicion) {
      console.assert(condicion, descripcion);
      resultados.push(!!condicion);
      document.getElementById('resultados').insertAdjacentHTML('beforeend',
        '<li class="' + (condicion ? 'ok' : 'falla') + '">' + (condicion ? '✓ ' : '✗ ') + descripcion + '</li>');
    }
    function escuchar(nombre) {
      const capturados = [];
      window.addEventListener(nombre, function (e) { capturados.push(e.detail); });
      return capturados;
    }

    (async function () {
      const actualizados = escuchar('carrito:actualizado');
      const confirmados = escuchar('pedido:confirmado');

      // 1. Expone lo acordado
      verificar('define la etiqueta <mfe-carrito>', !!customElements.get('mfe-carrito'));

      // 2. El montaje genera contenido
      const el = document.createElement('mfe-carrito');
      document.getElementById('zona').appendChild(el);
      verificar('al montarse crea un shadowRoot con contenido', !!(el.shadowRoot && el.shadowRoot.querySelector('h2')));

      // 3. Consume carrito:agregar v1.0 … y también un productor que ya mande campos nuevos (lector tolerante)
      window.dispatchEvent(new CustomEvent('carrito:agregar', { detail: { version: '1.0', id: 1, nombre: 'Plato A', precio: 10000 } }));
      window.dispatchEvent(new CustomEvent('carrito:agregar', { detail: { version: '1.1', id: 2, nombre: 'Plato B', precio: 2500, imagen: 'b.png' } }));
      verificar('reacciona a carrito:agregar mostrando los platos', el.shadowRoot.querySelectorAll('tr').length === 3);

      // 4. carrito:actualizado v1.0 { version, cantidad, total }
      const ultimo = actualizados[actualizados.length - 1];
      verificar('publica carrito:actualizado', !!ultimo);
      verificar('carrito:actualizado.version es "1.0"', ultimo && ultimo.version === '1.0');
      verificar('carrito:actualizado trae cantidad = 2 y total = 12500', ultimo && ultimo.cantidad === 2 && ultimo.total === 12500);

      // 5. pedido:confirmado v1.1 { version, id, fecha, items, total, metodoPago }
      el.shadowRoot.querySelector('select[name="pago"]').value = 'Nequi';
      el.shadowRoot.querySelector('select[name="pago"]').dispatchEvent(new Event('change', { bubbles: true }));
      el.shadowRoot.querySelector('.confirmar').click();
      const pedido = confirmados[0];
      verificar('publica pedido:confirmado al confirmar', !!pedido);
      verificar('pedido:confirmado.version es "1.1"', pedido && pedido.version === '1.1');
      verificar('trae id y fecha ISO', pedido && typeof pedido.id === 'string' && !isNaN(Date.parse(pedido.fecha)));
      verificar('trae items con { id, nombre, precio, cantidad }', pedido && Array.isArray(pedido.items) && pedido.items.length === 2 &&
        pedido.items.every(it => typeof it.id === 'number' && typeof it.nombre === 'string' && typeof it.precio === 'number' && typeof it.cantidad === 'number'));
      verificar('trae total = 12500', pedido && pedido.total === 12500);
      verificar('v1.1: trae metodoPago = "Nequi"', pedido && pedido.metodoPago === 'Nequi');
      verificar('al confirmar el carrito se vacía (cantidad 0)', actualizados[actualizados.length - 1].cantidad === 0);

      // 6. Desmontaje limpio
      el.remove();
      verificar('se puede desmontar sin errores', !document.querySelector('#zona mfe-carrito'));

      const pasaron = resultados.filter(Boolean).length;
      document.getElementById('resumen').textContent = pasaron + ' de ' + resultados.length + ' verificaciones pasaron';
      document.title = (pasaron === resultados.length ? '✓ ' : '✗ ') + document.title;
      window.RESULTADO_CONTRATO = { pasaron: pasaron, total: resultados.length };
    })();
  </script>
</body>
</html>
